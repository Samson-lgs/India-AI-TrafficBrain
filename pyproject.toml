[project]
name = "india-ai-trafficbrain"
version = "0.1.0"
description = "AI traffic control research platform for Indian mixed-traffic networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "torch>=2.3", "scikit-learn>=1.5", "fastapi>=0.115", "uvicorn>=0.30", "streamlit>=1.38", "requests>=2.32"]
[project.optional-dependencies]
dev=["pytest>=8.3","httpx>=0.27","ruff>=0.6"]
[tool.pytest.ini_options]
pythonpath=["src"]
